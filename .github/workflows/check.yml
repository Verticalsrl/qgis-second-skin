name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install flake8 bandit
      - run: flake8 --max-line-length=120 retro_skin scripts
      - run: bandit -q -r retro_skin
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: retro_skin-plugin
          path: dist/*.zip
